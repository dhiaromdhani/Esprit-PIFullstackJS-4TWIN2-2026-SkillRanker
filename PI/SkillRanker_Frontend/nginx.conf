server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend Node.js
  location /api/ {
    proxy_pass http://skillranker-backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Flask ML — routes directes
  location /analyze {
    proxy_pass http://flask-ml-service:5000/analyze;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /optimize-prompt {
    proxy_pass http://flask-ml-service:5000/optimize-prompt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /suggestions {
    proxy_pass http://flask-ml-service:5000/suggestions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /chat {
    proxy_pass http://flask-ml-service:5000/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
}

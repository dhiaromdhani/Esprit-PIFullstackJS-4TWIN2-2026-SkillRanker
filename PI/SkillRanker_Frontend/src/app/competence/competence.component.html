<app-navbar></app-navbar>
<app-header></app-header>

<main class="nxl-container">
  <div class="nxl-content">

    <div class="container-fluid py-4 px-4">

      <!-- ── HEADER ── -->
      <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">

        <div>
          <p class="text-muted text-uppercase fw-semibold mb-1"
             style="font-size: 0.72rem; letter-spacing: 0.15em;">
            Gestion des compétences
          </p>

          <h1 class="fw-bold mb-0"
              style="font-size: 2rem; letter-spacing: -0.02em;">
            Compétences

            <span class="badge bg-dark ms-2"
                  style="font-size: 0.75rem; border-radius: 100px;">
              {{ competences.length }}
            </span>
          </h1>
        </div>

        <button class="btn btn-danger fw-semibold px-4"
                style="border-radius: 12px;"
                (click)="openModal()">
          + Nouvelle compétence
        </button>

      </div>

      <!-- ── EMPTY STATE ── -->
      <div class="text-center py-5 my-4"
           *ngIf="competences.length === 0">

        <div style="font-size:3rem; opacity:0.3;" class="mb-3">🧠</div>

        <p class="text-muted fw-semibold">
          Aucune compétence pour le moment
        </p>

        <button class="btn btn-outline-danger mt-2"
                style="border-radius: 10px;"
                (click)="openModal()">
          Ajouter une compétence
        </button>
      </div>

      <!-- ── CARDS ── -->
      <div class="row g-3" *ngIf="competences.length > 0">

        <div class="col-md-6 col-lg-4"
             *ngFor="let c of competences; let i = index">

          <div class="card h-100 shadow-sm border"
               style="border-radius:16px; border-color:#e8e3da !important;">

            <!-- top bar -->
            <div style="height:4px; background:linear-gradient(90deg,#dc3545,#f08070);
                        border-radius:16px 16px 0 0;"></div>

            <div class="card-body p-4">

              <!-- index + status -->
              <div class="d-flex justify-content-between mb-2">

                <span class="text-uppercase text-muted fw-semibold"
                      style="font-size:0.65rem; letter-spacing:0.15em;">
                  Compétence #{{ i + 1 }}
                </span>

                <span class="badge rounded-pill"
                      style="background:#f0ece4; font-size:0.7rem;">
                  {{ c.etat }}
                </span>

              </div>

              <!-- title -->
              <h5 class="fw-bold mb-2">
                {{ c.intitule }}
              </h5>

              <!-- infos -->
              <p class="text-muted mb-1" style="font-size:0.85rem;">
                Type: {{ c.type }}
              </p>

              <p class="text-muted mb-1" style="font-size:0.85rem;">
                Auto Eval: {{ c.auto_eval }}
              </p>

              <p class="text-muted mb-0" style="font-size:0.85rem;">
                Manager Eval: {{ c.hierarchie_eval }}
              </p>

            </div>

            <!-- footer -->
            <div class="card-footer bg-transparent d-flex justify-content-end gap-2 px-4 py-3"
                 style="border-top:1px solid #e8e3da;">

              <button class="btn btn-sm btn-outline-secondary"
                      style="border-radius:8px; width:34px; height:34px; padding:0;"
                      (click)="edit(c)">
                ✏️
              </button>

              <button class="btn btn-sm btn-outline-danger"
                      style="border-radius:8px; width:34px; height:34px; padding:0;"
                      (click)="delete(c._id)">
                🗑️
              </button>

            </div>

          </div>
        </div>
      </div>

    </div>

    <!-- ── MODAL ── -->
    <div class="modal-backdrop fade show"
         *ngIf="showModal"
         (click)="closeModal()"></div>

    <div class="modal d-block"
         *ngIf="showModal">

      <div class="modal-dialog modal-dialog-centered"
           (click)="$event.stopPropagation()">

        <div class="modal-content border-0 shadow"
             style="border-radius:20px; overflow:hidden;">

          <div class="modal-header px-4 py-3">
            <h5 class="fw-bold">
              {{ editMode ? 'Modifier' : 'Nouvelle' }}
              <span class="text-danger">compétence</span>
            </h5>

            <button class="btn-close" (click)="closeModal()"></button>
          </div>

          <div class="modal-body px-4 py-3">

            <form [formGroup]="form">

              <input class="form-control mb-2"
                     style="border-radius:10px; background:#f7f5f0;"
                     formControlName="fiches_id"
                     placeholder="Fiche ID">

              <input class="form-control mb-2"
                     style="border-radius:10px; background:#f7f5f0;"
                     formControlName="question_competence_id"
                     placeholder="Question ID">

              <input class="form-control mb-2"
                     style="border-radius:10px; background:#f7f5f0;"
                     formControlName="type"
                     placeholder="Type">

              <input class="form-control mb-2"
                     style="border-radius:10px; background:#f7f5f0;"
                     formControlName="intitule"
                     placeholder="Intitulé">

              <input type="number"
                     class="form-control mb-2"
                     style="border-radius:10px; background:#f7f5f0;"
                     formControlName="auto_eval"
                     placeholder="Auto Eval">

              <input type="number"
                     class="form-control mb-2"
                     style="border-radius:10px; background:#f7f5f0;"
                     formControlName="hierarchie_eval"
                     placeholder="Manager Eval">

              <select class="form-control mb-2"
                      style="border-radius:10px; background:#f7f5f0;"
                      formControlName="etat">

                <option value="draft">draft</option>
                <option value="submitted">submitted</option>
                <option value="validated">validated</option>

              </select>

            </form>

          </div>

          <div class="modal-footer px-4 py-3 gap-2">

            <button class="btn btn-outline-secondary"
                    style="border-radius:10px;"
                    (click)="closeModal()">
              Annuler
            </button>

            <button class="btn btn-danger fw-semibold px-4"
                    style="border-radius:10px;"
                    (click)="submit()">
              {{ editMode ? 'Enregistrer' : 'Ajouter' }}
            </button>

          </div>

        </div>
      </div>
    </div>

  </div>
</main>

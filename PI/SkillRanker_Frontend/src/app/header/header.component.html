      <div class="sr-page-context d-none d-lg-flex">

      <!-- <div class="header-search sr-header-search d-none d-md-flex">
        <i class="feather-search"></i>
        <input type="text" [placeholder]="'common.search' | translate" />
      </div> -->
      <div
  class="header-search sr-header-search sr-header-search-working d-none d-md-flex"
  [class.search-open]="isSearchOpen">

  <i class="feather-search sr-search-icon"></i>

  <input
    type="text"
    [value]="searchTerm"
    (input)="onSearchInput($event)"
    (focus)="openSearch()"
    (blur)="closeSearch()"
    (keydown.enter)="runSearch()"
    [placeholder]="'common.search' | translate"
    autocomplete="off"
    aria-label="Search" />

  <button
    *ngIf="searchTerm"
    type="button"
    class="sr-search-clear"
    (mousedown)="$event.preventDefault()"
    (click)="clearSearch()">
    <i class="feather-x"></i>
  </button>

  <div class="sr-search-dropdown" *ngIf="isSearchOpen">

    <button
      *ngFor="let item of searchResults; trackBy: trackByRoute"
      type="button"
      class="sr-search-result"
      (mousedown)="$event.preventDefault()"
      (click)="goToSearchResult(item)">

      <span class="sr-search-result-icon">
        <i [class]="item.icon"></i>
      </span>

      <span class="sr-search-result-content">
        <strong>{{ item.labelKey | translate }}</strong>
        <small>{{ item.descriptionKey | translate }}</small>
      </span>

      <i class="feather-arrow-right sr-search-result-arrow"></i>
    </button>

    <div class="sr-search-empty" *ngIf="searchResults.length === 0">
      <i class="feather-search"></i>
      <span>{{ 'headerSearch.noResults' | translate }}</span>
    </div>

  </div>
</div>
    </div>

    <div class="sr-header-right">

      <div class="sr-header-control-panel">

        <app-language-selector></app-language-selector>

        <div class="sr-theme-switch" role="group" aria-label="Theme selector">
          <button
            type="button"
            class="sr-theme-option"
            [class.active]="isTheme('light')"
            (click)="setTheme('light')">
            <span class="sr-theme-dot"></span>
            <span>{{ 'common.lightMode' | translate }}</span>
          </button>

          <button
            type="button"
            class="sr-theme-option"
            [class.active]="isTheme('dark')"
            (click)="setTheme('dark')">
            <span class="sr-theme-dot"></span>
            <span>{{ 'common.darkMode' | translate }}</span>
          </button>
        </div>

      </div>

 <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.ico" />

<body>
  <app-root></app-root>
   <script src="assets/vendors/js/vendors.min.js"></script>
    <!-- vendors.min.js {always must need to be top} -->

    <!--! END: Vendors JS !-->

    <script src="assets/js/common-init.min.js"></script>
    <script src="assets/js/dashboard-init.min.js"></script>
    <!--! END: Apps Init !-->
    <!--! BEGIN: Theme Customizer  !-->
    <script src="assets/js/theme-customizer-init.min.js"></script>
    <script>
const OPENROUTER_API_KEY = environment.openRouterApiKey;
const MODEL = "openrouter/free";
const chatHistory = [];

function toggleChat() {
  const win = document.getElementById('chat-window');
  win.style.display = win.style.display === 'none' ? 'flex' : 'none';
  if (win.style.display === 'flex') document.getElementById('chat-input').focus();
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('chat-input') === document.activeElement && e.key === 'Enter') sendChat();
});

function addMsg(text, cls) {
  const box = document.getElementById('chat-box');
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  return d;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('chat-send').disabled = true;
  addMsg(text, 'user-msg');
  chatHistory.push({ role: 'user', content: text });
  const typing = addMsg('...', 'typing');
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENROUTER_API_KEY },
      body: JSON.stringify({ model: MODEL, messages: chatHistory })
    });
    const data = await res.json();
    typing.remove();
    const reply = data.error ? 'Error: ' + data.error.message : data.choices[0].message.content;
    if (!data.error) chatHistory.push({ role: 'assistant', content: reply });
    addMsg(reply, data.error ? 'error-msg' : 'bot-msg');
  } catch(e) { typing.remove(); addMsg('Network error', 'error-msg'); }
  document.getElementById('chat-send').disabled = false;
}
</script>
</body>
</html>
